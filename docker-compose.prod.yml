# Production overrides: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# Requires real values in .env: ENVIRONMENT=production, SECRET_KEY, POSTGRES_PASSWORD,
# SMTP_* and ADMIN_*. SEED_DEMO_DATA must be false.
services:
  mailpit: !reset null
  migrate:
    volumes: !reset []
  api:
    volumes: !reset []
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
  worker:
    volumes: !reset []
  beat:
    volumes: !reset []
  ui:
    volumes: !reset []
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --workers 2
