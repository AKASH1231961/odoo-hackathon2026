# Fixed name: keeps the existing database volume whatever this folder is called
name: subscription-mgmt

x-backend: &backend
  image: brightloop-sms-backend
  build:
    context: .
    dockerfile: backend/Dockerfile
  restart: unless-stopped
  env_file: .env
  environment: &backend-env
    DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/subscription_db
    REDIS_URL: redis://redis:6379/0
  volumes:
    - ./backend:/app

services:
  db:
    image: postgres:16-alpine
    container_name: sms_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: subscription_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - sms_postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d subscription_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sms_redis
    restart: unless-stopped
    volumes:
      - sms_redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Catches every outgoing email in development; read them at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: sms_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

  # One-shot: migrations, demo data and the first admin, before anything else starts
  migrate:
    <<: *backend
    container_name: sms_migrate
    restart: "no"
    command: python scripts/prestart.py
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    container_name: sms_api
    ports:
      - "8000:8000"
    depends_on: &ready
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    <<: *backend
    container_name: sms_worker
    depends_on: *ready
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 30s

  beat:
    <<: *backend
    container_name: sms_beat
    depends_on: *ready
    command: celery -A app.tasks.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule

  # Web UI; talks to the API through its own /api proxy
  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    image: brightloop-sms-ui
    container_name: sms_ui
    restart: unless-stopped
    environment:
      API_URL: http://api:8000
    volumes:
      - ./ui:/app
    ports:
      - "${UI_PORT:-8081}:8000"
    depends_on:
      api:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/dashboard.html')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  sms_postgres_data:
  sms_redis_data:
